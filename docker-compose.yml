services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/carbonledger
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  db:
    # 16 to match supabase/verification/run.sh, which is where the migrations are
    # actually proven to apply. A local database on a different major version
    # than the one under test is a difference nobody would think to check.
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=carbonledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initdb runs the entries below in filename order. supabase/migrations is
      # deliberately NOT mounted here: 0002 creates functions in an `auth`
      # schema, which a plain Postgres image does not have, so mounting the
      # directory directly fails on the second file. The stub goes first, then
      # 10-apply-migrations.sh applies the migrations from /migrations.
      #
      # The stub is the same file the RLS harness uses, rather than a second
      # copy that can drift from it. It is not in supabase/migrations on
      # purpose: on a real Supabase project it would collide with the real
      # auth.jwt().
      #
      # 20-seed.sql sorts after the migrations, so the sample data lands on the
      # schema they create. initdb runs with ON_ERROR_STOP, so a seed that stops
      # matching the schema fails the container rather than half-populating it.
      - ./supabase/verification/auth-stub.sql:/docker-entrypoint-initdb.d/00-auth-stub.sql:ro
      - ./docker/initdb/10-apply-migrations.sh:/docker-entrypoint-initdb.d/10-apply-migrations.sh:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  supabase-studio:
    image: supabase/studio:latest
    ports:
      - "3001:3000"
    environment:
      - STUDIO_PG_META_URL=http://db:5432
      - SUPABASE_URL=http://localhost:8000
      - SUPABASE_REST_URL=http://localhost:3000
    depends_on:
      - db

volumes:
  postgres_data:
